overrides:
  # 甘雨充能
  - id: 1101
    maxEnergy: 2
  # 宵宫充能
  - id: 1305
    maxEnergy: 2
  # 魔偶剑鬼霜驰影突费用
  - id: 25013
    playCost: [{ "type": "GCG_COST_DICE_ANEMO", "count": 3 }]
  # 婕德
  - id: 322022
    rawDynamicDescription: |
      此牌会记录本场对局中我方支援区弃置卡牌的数量，称为「阅历」。（最多6点，<color=#D3BC8EFF>当前为${[GCG_TOKEN_COUNTER]}点</color>）
      <color=#FFFFFFFF>我方角色使用「元素爆发」后：</color>如果「阅历」至少为5，则弃置此牌，生成<color=#FFFFFFFF>「阅历」-2</color>数量的$[K411]。
  # 苦舎桓
  - id: 323008
    rawDescription: |
      <color=#FFFFFFFF>行动阶段开始时：</color>$[K56]最多2张$[K3002]最高的手牌，每$[K56]1张，此牌就累积1点<color=#FFFFFFFF>「记忆和梦」</color>。（最多2点）
      <color=#FFFFFFFF>我方角色使用技能时：</color>如果我方本回合未打出过行动牌，则消耗1点<color=#FFFFFFFF>「记忆和梦」</color>，以使此技能少花费1个元素骰。
  # 兽肉薄荷卷
  - id: 333008
    rawDescription: |
      目标角色在本回合结束前，<color=#FFFFFFFF>「普通攻击」</color>少花费1个$[K309]。
      （每回合每个角色最多食用1次「{SPRITE_PRESET#3101}料理」）
  # 迸发扫描
  - id: 117082
    rawDescription: |
      <color=#FFFFFFFF>双方选择行动前：</color>如果我方场上存在$[C116]或$[C112082]，则使其$[K3]-1，并$[K56]我方牌库顶的1张卡牌。然后，造成所$[K56]卡牌[K3002]+1的$[K107]。
      <color=#FFFFFFFF>$[K3]：1</color>（可叠加，最多叠加到3次）
  # 重云天赋
  - id: 211041
    rawDescription: |
      $[K1]：我方出战角色为<color=#FFFFFFFF>$[A1104]</color>时，装备此牌。
      $[A1104]装备此牌后，立刻使用一次<color=#FFD780FF>$[S11042]</color>。
      装备有此牌的$[A1104]生成的<color=#FFFFFFFF>$[C111041]</color>获得以下效果：
      初始$[K4]+1，并且使我方单手剑、双手剑或长柄武器角色的<color=#FFFFFFFF>普通攻击</color>伤害+1。
      （牌组中包含$[A1104]，才能加入牌组）
    rawPlayingDescription: |
      装备有此牌的$[A1104]生成的<color=#FFFFFFFF>$[C111041]</color>获得以下效果：
      初始$[K4]+1，并且使我方单手剑、双手剑或长柄武器角色的<color=#FFFFFFFF>普通攻击</color>伤害+1。
  # 雷元素伤害
  - id: -104
    rawDescription: |
      附着{SPRITE_PRESET#2104}雷元素，可发生元素反应：
      {SPRITE_PRESET#2104}{SPRITE_PRESET#2103}<color=#FFFFFFFF>超载</color>：本伤害+2，目标强制切换到下一个角色
      {SPRITE_PRESET#2104}{SPRITE_PRESET#2101}<color=#FFFFFFFF>超导</color>：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害
      {SPRITE_PRESET#2104}{SPRITE_PRESET#2102}<color=#FFFFFFFF>感电</color>：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害
      {SPRITE_PRESET#2104}{SPRITE_PRESET#2107}<color=#FFFFFFFF>原激化</color>：本伤害+1，生成使下3次草元素或雷元素伤害+1的[<color=#FFFFFFFF>激化领域</color>]
      {SPRITE_PRESET#2104}{SPRITE_PRESET#2102}<color=#FFFFFFFF>月感电</color>：生成回合结束时造成2点{SPRITE_PRESET#2104}<color=#FFACFFFF>雷元素伤害</color>的[<color=#FFFFFFFF>雷暴云</color>]。（可用次数1，可叠加，没有上限，入场或可用次数增加时，赋予敌方随机1张手牌[<color=#FFFFFFFF>电击</color>]）
  # 草元素伤害
  - id: -107
    rawDescription: |
      附着{SPRITE_PRESET#2107}草元素，可发生元素反应：
      {SPRITE_PRESET#2107}{SPRITE_PRESET#2102}<color=#FFFFFFFF>绽放</color>：本伤害+1，生成使下次火元素或雷元素伤害+2的[<color=#FFFFFFFF>草原核</color>]
      {SPRITE_PRESET#2107}{SPRITE_PRESET#2103}<color=#FFFFFFFF>燃烧</color>：本伤害+1，生成回合结束时造成1点火元素伤害的[<color=#FFFFFFFF>燃烧烈焰</color>]（可用次数1，最多叠加到2）
      {SPRITE_PRESET#2107}{SPRITE_PRESET#2104}<color=#FFFFFFFF>原激化</color>：本伤害+1，生成使下3次草元素或雷元素伤害+1的[<color=#FFFFFFFF>激化领域</color>]。
      {SPRITE_PRESET#2107}{SPRITE_PRESET#2102}<color=#FFFFFFFF>月绽放</color>：本伤害+1，并赋予我方随机1张手牌[<color=#FFFFFFFF>费用降低</color>]
  # 附着雷元素
  - id: -204
    rawDescription: |
      不通过伤害附着{SPRITE_PRESET#2104}雷元素时，发生的元素反应会忽略伤害效果：
      {SPRITE_PRESET#2104}{SPRITE_PRESET#2103}<color=#FFFFFFFF>超载</color>：目标强制切换到下一个角色
      {SPRITE_PRESET#2104}{SPRITE_PRESET#2101}<color=#FFFFFFFF>超导</color>：没有效果
      {SPRITE_PRESET#2104}{SPRITE_PRESET#2102}<color=#FFFFFFFF>感电</color>：没有效果
      {SPRITE_PRESET#2104}{SPRITE_PRESET#2107}<color=#FFFFFFFF>原激化</color>：生成使下3次草元素或雷元素伤害+1的[<color=#FFFFFFFF>激化领域</color>]
  # 附着草元素
  - id: -207
    rawDescription: |
      不通过伤害附着{SPRITE_PRESET#2107}草元素时，发生的元素反应会忽略伤害效果：
      {SPRITE_PRESET#2107}{SPRITE_PRESET#2102}<color=#FFFFFFFF>绽放</color>：生成使下次火元素或雷元素伤害+2的[<color=#FFFFFFFF>草原核</color>]
      {SPRITE_PRESET#2107}{SPRITE_PRESET#2103}<color=#FFFFFFFF>燃烧</color>：生成回合结束时造成1点火元素伤害的[<color=#FFFFFFFF>燃烧烈焰</color>]（可用次数1，最多叠加到2）
      {SPRITE_PRESET#2107}{SPRITE_PRESET#2104}<color=#FFFFFFFF>原激化</color>：生成使下3次草元素或雷元素伤害+1的[<color=#FFFFFFFF>激化领域</color>]
  # 雷元素相关反应
  - id: -214
    rawDescription: |
      {SPRITE_PRESET#2104}{SPRITE_PRESET#2103}<color=#FFFFFFFF>超载</color>：本伤害+2，目标强制切换到下一个角色
      {SPRITE_PRESET#2104}{SPRITE_PRESET#2101}<color=#FFFFFFFF>超导</color>：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害
      {SPRITE_PRESET#2104}{SPRITE_PRESET#2102}<color=#FFFFFFFF>感电</color>：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害
      {SPRITE_PRESET#2104}{SPRITE_PRESET#2107}<color=#FFFFFFFF>原激化</color>：本伤害+1，生成使下3次草元素或雷元素伤害+1的[<color=#FFFFFFFF>激化领域</color>]
      {SPRITE_PRESET#2106}{SPRITE_PRESET#2104}<color=#FFFFFFFF>结晶（雷）</color>：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。
      {SPRITE_PRESET#2105}{SPRITE_PRESET#2104}<color=#FFFFFFFF>扩散（雷）</color>：对目标以外的所有敌方角色造成1点雷元素伤害\\n{SPRITE_PRESET#2104}{SPRITE_PRESET#2102}<color=#FFFFFFFF>月感电</color>：生成回合结束时造成2点{SPRITE_PRESET#2104}<color=#FFACFFFF>雷元素伤害</color>的[<color=#FFFFFFFF>雷暴云</color>]。（可用次数1，可叠加，没有上限，入场或可用次数增加时，赋予敌方随机1张手牌[<color=#FFFFFFFF>电击</color>]）
  # 草元素相关反应
  - id: -217
    rawDescription: |
      {SPRITE_PRESET#2107}{SPRITE_PRESET#2102}<color=#FFFFFFFF>绽放</color>：本伤害+1，生成使下次火元素或雷元素伤害+2的[<color=#FFFFFFFF>草原核</color>]
      {SPRITE_PRESET#2107}{SPRITE_PRESET#2103}<color=#FFFFFFFF>燃烧</color>：本伤害+1，生成回合结束时造成1点火元素伤害的[<color=#FFFFFFFF>燃烧烈焰</color>]（可用次数1，最多叠加到2）
      {SPRITE_PRESET#2107}{SPRITE_PRESET#2104}<color=#FFFFFFFF>原激化</color>：本伤害+1，生成使下3次草元素或雷元素伤害+1的[<color=#FFFFFFFF>激化领域</color>]
      {SPRITE_PRESET#2107}{SPRITE_PRESET#2102}<color=#FFFFFFFF>月绽放</color>：本伤害+1，并赋予我方随机1张手牌[<color=#FFFFFFFF>费用降低</color>]
